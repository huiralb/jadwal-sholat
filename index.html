<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jadwal Sholat</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <section id="view-jadwal" class="view">
      <header>
        <div id="kota" class="kota">Belum ada lokasi</div>
        <div id="tanggal" class="tanggal"></div>
      </header>
      <ul id="daftar" class="daftar"></ul>
      <div id="countdown" class="countdown">—</div>
      <footer>
        <button id="btn-pengaturan" type="button">Pengaturan</button>
        <button id="btn-keluar" type="button">Keluar</button>
      </footer>
    </section>

    <section id="view-pengaturan" class="view hidden">
      <header>
        <button id="btn-kembali" type="button" aria-label="Kembali">←</button>
        <h2>Pengaturan</h2>
      </header>
      <div class="field">
        <label for="kota-input">Lokasi</label>
        <div id="kota-terpilih" class="terpilih"></div>
        <input
          id="kota-input"
          type="text"
          placeholder="Cari kota/kabupaten…"
          autocomplete="off"
        />
        <ul id="kota-hasil" class="hasil"></ul>
      </div>
      <label class="toggle">
        <span>Notifikasi waktu sholat</span>
        <input type="checkbox" id="toggle-notifikasi" />
      </label>
      <label class="toggle">
        <span>Autostart saat login</span>
        <input type="checkbox" id="toggle-autostart" />
      </label>
    </section>
  </body>
</html>
